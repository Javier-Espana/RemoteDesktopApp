[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/discovery",
    "crates/display",
    "crates/streaming",
    "crates/input",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Javier España"]

[workspace.dependencies]
# Shared
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
hostname = "0.4"

# Discovery
mdns-sd = "0.12"

# GStreamer
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
gstreamer-webrtc = "0.23"
gstreamer-sdp = "0.23"

# GUI
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_4"] }

# Input
evdev = "0.13"

# Internal crates
screenextend-common = { path = "crates/common" }
screenextend-discovery = { path = "crates/discovery" }
screenextend-display = { path = "crates/display" }
screenextend-streaming = { path = "crates/streaming" }
screenextend-input = { path = "crates/input" }
